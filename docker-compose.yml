version: '3.8'

services:
  # Go Backend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: test_working_w_go-app:latest
    container_name: first-app
    restart: unless-stopped
    ports:
      # Publish port to 0.0.0.0 (accessible from any IP)
      - "0.0.0.0:1323:1323"
    env_file:
      # Load environment variables from .env file
      - .env
    networks:
      - docker_default
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1323/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  docker_default:
    external: true
