version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: first-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-own_assistant}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - first-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-own_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go Backend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: first-app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-1323}:1323"
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-own_assistant}
      DB_SSLMODE: ${DB_SSLMODE:-disable}

      # Server Configuration
      SERVER_PORT: 1323
      ENV: ${ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - first-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1323/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  first-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
