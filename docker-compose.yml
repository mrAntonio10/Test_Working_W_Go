version: '3.8'

services:
  # Go Backend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: test_working_w_go-app:latest
    container_name: first-app
    restart: unless-stopped
    network_mode: "host"
    environment:
      # Database Configuration (uses external PostgreSQL)
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-own_assistant}
      DB_SSLMODE: ${DB_SSLMODE:-disable}

      # Server Configuration
      SERVER_PORT: ${SERVER_PORT:-1323}
      ENV: ${ENV:-production}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1323/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
